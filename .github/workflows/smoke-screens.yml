# Temporary helper: runs the emulator smoke test and pushes the screenshots to the
# ci-smoke-screens branch so they can be reviewed from a sandbox without artifact access.
name: Smoke screens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: bash scripts/smoke-test.sh app/build/outputs/apk/debug/app-debug.apk smoke-out 2>&1 | tee smoke-out-log.txt
      - name: Push screenshots
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r smoke-out/. /tmp/shots/ 2>/dev/null || true
          cp smoke-out-log.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q -b ci-smoke-screens && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Smoke test screenshots" --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-smoke-screens
