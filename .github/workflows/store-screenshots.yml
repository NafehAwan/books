name: Store screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/store-screenshots.yml
      - scripts/store-screenshots.sh

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APK (test ad IDs; ads are off anyway in airplane mode)
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          script: bash scripts/store-screenshots.sh app/build/outputs/apk/debug/app-debug.apk store-shots
      - name: Publish the pictures to the ci-smoke-screens branch
        if: always()
        run: |
          rm -f store-shots/ui.xml
          cd store-shots
          git init -q -b ci-smoke-screens
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Store screenshots"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-smoke-screens
