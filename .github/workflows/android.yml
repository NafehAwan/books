name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug lintRelease

      - name: Debug APK
        run: ./gradlew assembleDebug

      # Optional: add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD
      # (see README.md) to get a signed release. Without them the release files are unsigned.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Release AAB and APK
        run: ./gradlew bundleRelease assembleRelease

      # The emulator test installs the release build (shrunk by R8), signed with a throwaway key.
      - name: Test-signed release APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore ci-test.jks -storepass android -keypass android -alias test \
            -keyalg RSA -keysize 2048 -validity 365 -dname "CN=CI test" 2>/dev/null
          "$BT/zipalign" -f -p 4 "$(ls app/build/outputs/apk/release/*.apk | head -1)" aligned.apk
          "$BT/apksigner" sign --ks ci-test.jks --ks-pass pass:android --key-pass pass:android \
            --out app-release-test.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-motors-release-test-apk
          path: app-release-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-motors-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-motors-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  smoke:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tiny-motors-debug-apk
      - uses: actions/download-artifact@v4
        with:
          name: tiny-motors-release-test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: bash scripts/smoke-test.sh app-release-test.apk smoke-out/release && bash scripts/smoke-test.sh app-debug.apk smoke-out/debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: smoke-out/
